<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Multimedia & iFrame Assignment-7</title>
  </head>
  <body>
    <h3>AUDIO PRACTICE</h3>
    <audio controls autoplay muted loop>
      <source
        src="https://codeskulptor-demos.commondatastorage.googleapis.com/descent/background%20music.mp3"
        type="audio/mpeg">Song
    </audio>

    <h3>VIDEO PRACTICE</h3>
    <video width="500" height="300" controls muted>
      <source
        src="https://res.cloudinary.com/demo/video/upload/elephants.mp4"
        type="video/mp4">Video
    </video>

    <br>

    <iframe
      width="560"
      height="315"
      src="http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
      type="video/mp4"
      frameborder="0"
      allowfullscreen
    >
    </iframe>

    <br>

    <iframe
      src="https://en.wikipedia.org/wiki/HTML5"
      width="800"
      height="400"
      title="External Documentation"
    >
    </iframe>

    <br>

    <iframe
      src="./first.html"
      width="500"
      height="300"
      title="Local File Practice"
    >
    </iframe>
  </body>
</html>
